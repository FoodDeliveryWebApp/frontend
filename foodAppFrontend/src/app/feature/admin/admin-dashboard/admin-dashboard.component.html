<div class="page-container">
  <h1 class="section-title">Admin Dashboard</h1>
  <div class="action-grid">
    <mat-card class="action-card" routerLink="/admin/add-restaurant">
      <mat-card-content>
        <mat-icon class="action-icon">add_business</mat-icon>
        <h3>Add Restaurant</h3>
        <p>Directly add a new restaurant</p>
      </mat-card-content>
    </mat-card>
    <mat-card class="action-card" routerLink="/admin/applications">
      <mat-card-content>
        <mat-icon class="action-icon">approval</mat-icon>
        <h3>Applications</h3>
        <p>Review and approve/reject restaurant applications</p>
      </mat-card-content>
    </mat-card>
    <mat-card class="action-card" routerLink="/admin/reports">
      <mat-card-content>
        <mat-icon class="action-icon">flag</mat-icon>
        <h3>Rating Reports</h3>
        <p>Process reports from restaurant managers</p>
      </mat-card-content>
    </mat-card>
  </div>
</div>
