server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://backend-jzcz.onrender.com/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host backend-jzcz.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /images/ {
        proxy_pass https://backend-jzcz.onrender.com/images/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host backend-jzcz.onrender.com;
    }

    location /swagger/ {
        proxy_pass https://backend-jzcz.onrender.com/swagger/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host backend-jzcz.onrender.com;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
